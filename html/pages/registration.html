<section class="full">
  <div class="registration-section">
    <h1>welcome.</h1>

    <div class="registration-container">
      <input type="email" class="reg-email" placeholder="mark@icloud.com" />

      <input
        type="password"
        class="reg-password"
        id=""
        placeholder="password"
      />

      <input
        type="password"
        class="reg-password"
        placeholder="confirm password"
      />

      <div class="reg-block">
        <input type="text" class="reg-name" id="regName" placeholder="Mark" />

        <input
          type="text"
          class="reg-second-name"
          id="regSurname"
          placeholder="Muslimov"
        />
      </div>

      <input type="checkbox" class="reg-terms" />
    </div>
    <div class="button">submit</div>
  </div>

  <!--  -->
  <div class="login-section hidden">
    <h1>create account.</h1>

    <div class="login-container">
      <input type="checkbox" id="terms" />
    </div>
    <div class="button">submit</div>
  </div>
</section>
